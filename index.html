<h1>Slop Dashboard</h1>
<p>Slop Dashboard is a private, single-user tool that runs on its owner's own computer. It reads view, like and follower counts for the owner's own YouTube, Facebook, Instagram and TikTok accounts and shows them in a local dashboard.</p>
<p>It is not offered to the public. <a href="privacy.html">Privacy policy</a></p>
